spring:
  application:
    name: perf-tuning

  datasource:
    url: jdbc:postgresql://localhost:5433/perfdb
    username: app
    password: app123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true

logging:
  level:
    org.hibernate.SQL: DEBUG
